# NeuroGPT Anxiety (DASPS) — subject-level 5-fold CV, FROM SCRATCH
# Fold 3 of 5: mirrors neurogpt_anxiety_scratch_s42.yaml (no pretrained
# weights) but uses the 5-fold split ('finetune_kfold3') instead of the
# fixed 70/15/15 split -- pairs with neurogpt_anxiety_kfold3_pretrained.yaml
# to isolate the contribution of pretraining under the same evaluation
# protocol used for the EEGPT kfold comparison.

# NeuroGPT Anxiety Training Configuration - FROM SCRATCH (seed 42)
# Mirror of neurogpt_anxiety.yaml but WITHOUT pretrained weights.
# Used to isolate the contribution of pretraining on the DASPS anxiety task.

seed: 42
master_port: 51523
multitask: false
model_type: 'neurogpt'

data:
  batch_size: 32
  num_workers: 1
  datasets:
    anxiety: 'finetune_kfold3'

model:
  pretrained_path: null          
  
  num_encoder_layers: 6
  n_filters_time: 40
  filter_time_length: 25
  pool_time_length: 75
  pool_time_stride: 15
  drop_prob: 0.5
  att_heads: 10
  att_drop_prob: 0.5
  
  num_hidden_layers: 6
  embedding_dim: 1024
  num_attention_heads: 8
  n_positions: 512
  dropout: 0.1
  
  chunk_len: 512
  num_chunks: 2
  chunk_ovlp: 0
  ft_only_encoder: true

  classifier_head:
    head_type: 'avg_pool'
    hidden_dims: [128]
    dropout: 0.3

training:
  max_epochs: 50
  weight_decay: 0.01
  max_grad_norm: 3.0
  lr_schedule: "cosine"
  max_lr: 1e-4
  encoder_lr_scale: 1.0
  warmup_epochs: 5
  warmup_scale: 0.1
  min_lr: 5e-4
  use_amp: false
  freeze_encoder: false
  label_smoothing: 0.1
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ['default']
    lora_exclude_modules: null
    lora_target_type: 'default'
    lora_scope: 'transformer'
    lora_lr_scale: 1.0

logging:
  experiment_name: "neurogpt_anxiety_kfold3_scratch"
  run_dir: "assets/run"
  use_cloud: true
  cloud_backend: "wandb"
  project: "neurogpt_anxiety_kfold_scratch"
  entity: null
  api_key: null
  offline: false
  tags: ["neurogpt", "anxiety", "dasps", "14ch", "kfold", "fold3", "scratch"]
  log_step_interval: 2
  ckpt_interval: 1